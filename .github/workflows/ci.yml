name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (Next.js)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install signaling dependencies
        run: cd mini-services/signaling && bun install --frozen-lockfile

      - name: Build signaling server check
        run: cd mini-services/signaling && bun build index.ts --target=bun --outdir /tmp/signaling-check

  docker:
    name: Publish Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classmeet-app:latest
            ghcr.io/${{ github.repository_owner }}/classmeet-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push signaling image
        uses: docker/build-push-action@v6
        with:
          context: ./mini-services/signaling
          file: ./mini-services/signaling/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/classmeet-signaling:latest
            ghcr.io/${{ github.repository_owner }}/classmeet-signaling:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
