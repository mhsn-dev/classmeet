name: classmeet

# Single tiny static web server — signaling is serverless (Trystero public
# relays) and media is peer-to-peer, so this runs on ~0 CPU and few MB of RAM.
# Perfect for a 2GB RAM / 1 CPU core VPS.
services:
  web:
    build: .
    ports:
      - "${CLASSMEET_PORT:-8080}:8080"
    restart: unless-stopped
    mem_limit: 128m
